<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Run Meeting | Your Business Coach</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#003366">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    body{opacity:0;transition:opacity .2s ease}
    .container{padding-bottom:100px;}
    .ws-header{padding:20px 16px 0}
    .ws-title{font-size:1.15rem;font-weight:800;color:var(--primary);margin:0 0 4px}
    .ws-sub{font-size:.83rem;color:#666;margin:0 0 20px;line-height:1.45}
    .ws-btn{padding:9px 20px;background:var(--accent);color:white;border:none;border-radius:8px;font-size:.85rem;font-weight:700;cursor:pointer;transition:background .15s}
    .ws-btn:hover{background:var(--accent-dark)}
    .ws-btn-secondary{padding:9px 18px;background:white;color:var(--primary);border:1.5px solid var(--border);border-radius:8px;font-size:.85rem;font-weight:700;cursor:pointer;transition:all .15s}
    .ws-btn-secondary:hover{border-color:var(--accent);color:var(--accent)}
    .meeting-detail{background:white;border:1px solid var(--border);border-radius:12px;padding:24px;margin:0 16px}
    .meeting-empty{text-align:center;padding:48px 20px;color:#aaa;font-family:inherit;background:white;border:1px solid var(--border);border-radius:12px;margin:0 16px}
    .meeting-detail-heading{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;flex-wrap:wrap;gap:12px}
    .meeting-detail-title{font-family:inherit;font-weight:700;color:var(--primary);font-size:1.15rem}
    .field-select{border:1.5px solid var(--border);border-radius:8px;padding:7px 12px;font-family:inherit;font-size:.85rem;color:var(--primary);background:white;cursor:pointer}
    .status-pill{font-size:.7rem;font-weight:700;padding:2px 7px;border-radius:20px}
    .sp-scheduled{background:#fef3c7;color:#92400e}
    .sp-in_progress{background:#dbeafe;color:#1e40af}
    .sp-completed{background:#d1fae5;color:#065f46}
    .agenda-section{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden}
    .agenda-toggle{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;background:#f0fdfa;border:none;cursor:pointer;text-align:left;transition:background .12s}
    .agenda-toggle:hover{background:#eef2fa}
    .agenda-num{width:26px;height:26px;border-radius:50%;background:var(--primary);color:white;display:grid;place-items:center;font-family:inherit;font-weight:700;font-size:.82rem;flex-shrink:0}
    .agenda-title-text{font-family:inherit;font-weight:700;color:var(--primary);font-size:.93rem;flex:1}
    .agenda-time{font-size:.78rem;color:var(--accent);font-family:inherit;font-weight:600}
    .agenda-arrow{margin-left:8px;font-size:.8rem;color:#aaa;transition:transform .2s}
    .agenda-toggle.open .agenda-arrow{transform:rotate(180deg)}
    .agenda-content{display:none;padding:16px}
    .agenda-content.open{display:block}

    /* v0.5.206 — Edit ›  link at top-right of each agenda section's content
       area, for sections that have a dedicated edit page. */
    .agenda-edit-row{display:flex;justify-content:flex-end;margin:-4px 0 10px}
    .agenda-edit-link{font-size:.78rem;font-weight:700;color:var(--accent);text-decoration:none;padding:4px 8px;border-radius:6px}
    .agenda-edit-link:hover{background:rgba(13,148,136,.08);text-decoration:none}

    /* v0.5.206 — read-only view lists inside agenda sections */
    .agenda-view-list{display:flex;flex-direction:column;gap:7px;margin:0;padding:0;list-style:none}
    .agenda-view-row{display:flex;align-items:flex-start;gap:10px;padding:6px 0;border-bottom:1px dashed #f0f0f0}
    .agenda-view-row:last-child{border-bottom:none}
    .agenda-view-row .marker{color:#0D9488;font-weight:800;font-size:.75rem;min-width:14px;padding-top:2px;flex-shrink:0}
    .agenda-view-row .body{flex:1;min-width:0}
    .agenda-view-row .desc{font-size:.85rem;font-weight:600;color:var(--primary);line-height:1.35}
    .agenda-view-row .meta{font-size:.72rem;color:#888;margin-top:2px}
    .agenda-view-row .meta .owner{color:var(--accent);font-weight:700}
    .agenda-view-empty{font-size:.82rem;color:#aaa;font-style:italic;padding:6px 0}
    /* Status pill (Priorities Review) */
    .agenda-pill{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:99px;white-space:nowrap;flex-shrink:0}
    .agenda-pill.pill-green{background:#D1FAE5;color:#059669}
    .agenda-pill.pill-amber{background:#FEF3C7;color:#D97706}
    .agenda-pill.pill-red{background:#FEE2E2;color:#DC2626}
    .agenda-pill.pill-grey{background:#F3F4F6;color:#6B7280}
    /* Scorecard mini-table (Numbers Review) */
    .agenda-sc-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
    .agenda-sc-table{width:100%;border-collapse:collapse;font-size:.78rem;table-layout:auto}
    .agenda-sc-table th,.agenda-sc-table td{padding:5px 7px;border-bottom:1px solid #f0f0f0;text-align:right;white-space:nowrap}
    .agenda-sc-table th{font-size:.65rem;font-weight:800;color:var(--primary);text-transform:uppercase;letter-spacing:.5px;background:#fafbfc}
    .agenda-sc-table th.sc-name,.agenda-sc-table td.sc-name{text-align:left;color:var(--primary);font-weight:700}
    .agenda-sc-table td.sc-goal{color:#888;font-weight:700;font-size:.72rem}
    .agenda-sc-table td.hit{color:#0D9488;font-weight:700}
    .agenda-sc-table td.miss{color:#c53030;font-weight:700}
    .agenda-sc-table td.empty{color:#c0c0c0}
    .item-list{list-style:none;margin:0 0 12px;padding:0}
    .item-list li{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:1px solid #f0f0f0;border-radius:8px;margin-bottom:6px;font-size:.88rem;font-family:inherit}
    .item-list li .item-text{flex:1;color:var(--text)}
    .item-list li .item-meta{font-size:.75rem;color:#aaa;white-space:nowrap}
    .item-del-btn{background:none;border:none;cursor:pointer;color:#ccc;font-size:1rem;padding:0 4px;line-height:1}
    .item-del-btn:hover{color:#991b1b}
    .item-add-row{display:flex;gap:8px;flex-wrap:wrap}
    /* v0.5.207 — let the input take the full width on phones; the select + Add
       button drop to a second row instead of getting truncated. */
    .item-add-row .item-add-input{flex:1 1 100%;min-width:0}
    .item-add-row .field-select{flex:1 1 auto;min-width:0}
    .item-add-row .ws-btn{flex:0 0 auto}
    @media (min-width: 520px){
      .item-add-row .item-add-input{flex:1 1 auto}
    }
    .item-add-input{flex:1;border:1.5px solid var(--border);border-radius:8px;padding:8px 12px;font-family:inherit;font-size:.88rem;color:var(--text)}
    .item-add-input:focus{outline:none;border-color:var(--accent)}
    .meeting-timer-bar{display:flex;align-items:center;gap:12px;background:#f0fdfa;border-radius:8px;padding:10px 14px;margin-bottom:16px}
    .timer-btn{font-family:inherit;font-weight:700;font-size:.85rem;padding:6px 14px;border-radius:6px;cursor:pointer;border:1.5px solid var(--accent);background:white;color:var(--primary);transition:all .15s}
    .timer-btn.running{border-color:#991b1b;color:#991b1b;background:#fff5f5}
    .timer-elapsed{font-family:inherit;font-weight:700;font-size:1rem;color:var(--primary);font-variant-numeric:tabular-nums}
    .rating-btns{display:flex;gap:8px;flex-wrap:wrap}
    .rating-btn{width:40px;height:40px;border-radius:8px;border:2px solid var(--border);background:white;cursor:pointer;font-family:inherit;font-weight:700;font-size:.9rem;transition:all .15s}
    .rating-btn.selected{background:var(--primary);color:white;border-color:var(--primary)}
    .notes-textarea{width:100%;border:1.5px solid var(--border);border-radius:8px;padding:10px 14px;font-family:inherit;font-size:.88rem;resize:vertical;min-height:80px;box-sizing:border-box}
    .notes-textarea:focus{outline:none;border-color:var(--accent)}
    .toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:10px;font-family:inherit;font-weight:600;font-size:.88rem;z-index:2000;transition:opacity .3s;box-shadow:0 4px 12px rgba(0,0,0,.15)}
    .toast-hidden{opacity:0;pointer-events:none}
    .toast-success{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}
    .toast-error{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
    .hidden{display:none!important}
    .label-sm{font-family:inherit;font-weight:600;color:var(--primary);font-size:.85rem;margin-bottom:8px;display:block}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e5e7eb;display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 8px rgba(0,0,0,.06)}
    .bottom-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0 6px;text-decoration:none;color:#aaa;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;gap:3px;transition:color .15s}
    .bottom-nav-item.active,.bottom-nav-item:hover{color:#0D9488;text-decoration:none}
    .bottom-nav-icon{font-size:20px;line-height:1}
  </style>
  <script src="js/active-session.js" defer></script>
  <script src="js/active-meeting.js" defer></script>
  <script src="js/mobile-keyboard.js" defer></script>
  <script src="js/active-org.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-left">
        <!-- v0.5.209 — back link removed; bottom-nav covers it. -->
        <span class="header-title">Your Business Coach</span>
        <span id="activeBizName" class="biz-pill"></span>
      </div>
      <a href="index.html" class="header-account-btn" title="Account dashboard"><span>&#x1F3DB;&#xFE0F;</span><span>Account</span></a>
      <button class="sign-out-btn" id="signOutBtn">Sign Out</button>
    </div>
  </header>

  <div class="container">
    <div class="ws-header">
      <h1 class="ws-title" id="ws-title">&#x1F5D3;&#xFE0F; Run Meeting</h1>
      <p class="ws-sub" id="ws-sub">Work through the agenda, capture headlines, track to-dos, and rate the meeting.</p>
    </div>

    <div class="meeting-detail meeting-empty hidden" id="meeting-empty">
      No meeting selected. <a href="meeting.html" style="color:var(--accent);font-weight:600;">Back to Past Meetings &#x2192;</a>
    </div>
    <div id="meeting-content"></div>
  </div>

  <div class="toast toast-hidden" id="toast"></div>

  <nav class="bottom-nav">
    <a class="bottom-nav-item" href="business.html"><span class="bottom-nav-icon">&#x1F3E0;</span><span>Home</span></a>
    <a class="bottom-nav-item" href="planning.html"><span class="bottom-nav-icon">&#x1F5FA;&#xFE0F;</span><span>Planning</span></a>
    <a class="bottom-nav-item" href="strategy.html"><span class="bottom-nav-icon">&#x1F9ED;</span><span>Strategy</span></a>
    <a class="bottom-nav-item active" href="operations.html"><span class="bottom-nav-icon">&#x2699;&#xFE0F;</span><span>Operations</span></a>
    <a class="bottom-nav-item" href="learning-vault.html"><span class="bottom-nav-icon">&#x1F4DA;</span><span>Learn</span></a>
  </nav>

  <script type="module">
  'use strict';
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
  const supabase = createClient(
    'https://eekefsuaefgpqmjdyniy.supabase.co',
    'sb_publishable_pcXHwQVMpvEojb4K3afEMw_RMvgZM-Y'
  );

  /* Previous localStorage SEED (kept here as a reference for sample data only —
     no longer auto-applied. Headlines and todos are now read from Supabase
     tables `meeting_headlines` and `meeting_todos`, scoped by meeting_id.)
  */

  let orgId = null;
  let meetingId = null;
  let _currentMeeting=null, _headlines=[], _todos=[];
  // v0.5.206 — operational data loaded for in-section views of agenda sections
  // 2 (Numbers Review), 3 (Priorities Review), and 6 (Issues).
  let _scMetrics=[], _scEntries={}, _scWeeks=[], _rocks=[], _issues=[];
  let _timerInterval=null, _timerStart=null;
  let _meetingFiscalStart = 0;

  function escHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
  function showToast(msg,type='info'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast toast-'+type;t.classList.remove('toast-hidden');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.add('toast-hidden'),3000)}
  function fmtDate(d){if(!d)return '';const dt=new Date(d+'T00:00:00');return dt.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}
  function fiscalQuarterStr(date, startMonth) {
    const m = date.getMonth(), y = date.getFullYear();
    if (!startMonth) return 'Q' + (Math.floor(m / 3) + 1) + ' ' + y;
    const mInFY = (m - startMonth + 12) % 12;
    const q = Math.floor(mInFY / 3) + 1;
    const fyY = m >= startMonth ? y : y - 1;
    return 'Q' + q + ' ' + fyY + '/' + String(fyY + 1).slice(-2);
  }
  function fmtWeek(iso){const dt=new Date(iso+'T00:00:00');return dt.toLocaleDateString('en-AU',{day:'numeric',month:'short'});}
  function fmtVal(v,type){if(v===null||v===undefined||v==='')return '—';if(type==='currency')return '$'+Number(v).toLocaleString();if(type==='percentage')return v+'%';return String(v);}

  function getMeetingId(){
    const u = new URLSearchParams(window.location.search);
    return u.get('id') || null;
  }

  async function loadDetail(id){
    // v0.5.206 — also fetch the operational data the user reviews during the
    // meeting (scorecard metrics + recent entries, current quarter rocks,
    // current open issues) so each agenda section can show the actual items
    // inline. Same queries the dashboard + one-page-operations already use;
    // scoped by orgId via active-org.js (set in init() before this is called).
    const quarter = fiscalQuarterStr(new Date(), _meetingFiscalStart);
    const thisMondayIso = (() => {
      const d = new Date(); const day = d.getDay();
      d.setDate(d.getDate() + ((day === 0 ? -6 : 1) - day));
      return d.toISOString().slice(0, 10);
    })();
    _scWeeks = [-5,-4,-3,-2,-1,0].map(o => {
      const dt = new Date(thisMondayIso + 'T00:00:00');
      dt.setDate(dt.getDate() + o * 7);
      return dt.toISOString().slice(0, 10);
    });
    const [meetingRes, headlinesRes, todosRes, metricsRes, rocksRes, issuesRes] = await Promise.all([
      supabase.from('meetings').select('*').eq('id', id).maybeSingle(),
      supabase.from('meeting_headlines').select('*').eq('meeting_id', id).order('created_at', { ascending: true }),
      supabase.from('meeting_todos').select('*').eq('meeting_id', id).order('created_at', { ascending: true }),
      orgId ? supabase.from('scorecard_metrics')
        .select('id, name, owner, goal, measurement_type, sort_order')
        .eq('organisation_id', orgId)
        .order('sort_order', { ascending: true }) : Promise.resolve({ data: [] }),
      orgId ? supabase.from('rocks')
        .select('id, description, owner, status, company_rock, sort_order')
        .eq('organisation_id', orgId)
        .eq('quarter', quarter)
        .order('sort_order', { ascending: true }) : Promise.resolve({ data: [] }),
      orgId ? supabase.from('issues')
        .select('id, description, owner, status, created_at')
        .eq('organisation_id', orgId)
        .eq('category', 'current')
        .eq('status', 'open')
        .order('created_at', { ascending: true }) : Promise.resolve({ data: [] })
    ]);
    if (meetingRes.error || !meetingRes.data) {
      console.warn('Load meeting failed:', meetingRes.error && meetingRes.error.message);
      document.getElementById('meeting-empty').classList.remove('hidden');
      document.getElementById('meeting-empty').innerHTML='Meeting not found. <a href="meeting.html" style="color:var(--accent);font-weight:600;">Back to Past Meetings &#x2192;</a>';
      return;
    }
    _currentMeeting = meetingRes.data;
    _headlines = (!headlinesRes.error && Array.isArray(headlinesRes.data)) ? headlinesRes.data : [];
    _todos = (!todosRes.error && Array.isArray(todosRes.data)) ? todosRes.data : [];
    _scMetrics = (metricsRes && !metricsRes.error && Array.isArray(metricsRes.data)) ? metricsRes.data : [];
    _rocks = (rocksRes && !rocksRes.error && Array.isArray(rocksRes.data)) ? rocksRes.data : [];
    _issues = (issuesRes && !issuesRes.error && Array.isArray(issuesRes.data)) ? issuesRes.data : [];
    if (headlinesRes.error) console.warn('Load headlines failed:', headlinesRes.error.message);
    if (todosRes.error) console.warn('Load todos failed:', todosRes.error.message);

    // Scorecard entries for the visible weeks (second round-trip after metrics load).
    _scEntries = {};
    if (_scMetrics.length) {
      const metricIds = _scMetrics.map(m => m.id);
      const { data: entries } = await supabase
        .from('scorecard_entries')
        .select('metric_id, week_date, value')
        .in('metric_id', metricIds)
        .gte('week_date', _scWeeks[0]);
      if (Array.isArray(entries)) {
        for (const e of entries) {
          if (!_scEntries[e.metric_id]) _scEntries[e.metric_id] = {};
          _scEntries[e.metric_id][e.week_date] = e.value;
        }
      }
    }

    document.getElementById('ws-title').innerHTML='&#x1F5D3;&#xFE0F; '+fmtDate(_currentMeeting.meeting_date);
    document.getElementById('ws-sub').textContent=(_currentMeeting.quarter?_currentMeeting.quarter+' — ':'')+'Work through the agenda below.';

    // v0.5.207 — Floating "Meeting in progress" pill across all pages.
    // Set the pill whenever the meeting isn't completed yet; clear it once
    // the user marks it completed (via timer end or the status dropdown).
    if (window.activeMeeting) {
      if (_currentMeeting.status === 'completed') {
        window.activeMeeting.clear();
      } else {
        window.activeMeeting.set(_currentMeeting.id, fmtDate(_currentMeeting.meeting_date), orgId);
      }
    }

    renderDetail();
  }

  function renderDetail(){
    const m = _currentMeeting;
    const c=document.getElementById('meeting-content');
    if(_timerInterval){clearInterval(_timerInterval);_timerInterval=null;_timerStart=null;}
    c.innerHTML=`
      <div class="meeting-detail">
        <!-- v0.5.207 — duplicate date dropped; ws-title at the top already shows it.
             Status dropdown now sits alone, right-aligned, above the timer bar. -->
        <div class="meeting-detail-heading" style="justify-content:flex-end;">
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
            <select class="field-select" id="meeting-status">
              <!-- v0.5.209 — "Scheduled" dropped; meetings are either In Progress
                   (you've started running it) or Completed (you've wrapped up). -->
              <option value="in_progress" ${m.status!=='completed'?'selected':''}>In Progress</option>
              <option value="completed" ${m.status==='completed'?'selected':''}>Completed</option>
            </select>
          </div>
        </div>
        <div class="meeting-timer-bar" id="timer-bar">
          <!-- v0.5.219 — button is now Pause/Resume (toggles the visible ticker)
               rather than Start/End. Status dropdown above is the only way to
               actually complete the meeting. Default label gets overwritten by
               JS on render based on m.status. -->
          <button class="timer-btn" id="timer-btn">&#x23F8; Pause</button>
          <span class="timer-elapsed" id="timer-elapsed">0:00</span>
          <span style="font-size:.8rem;color:#888;font-family:inherit;">Target: 90 min</span>
        </div>
        <div id="agenda-accordion">
          ${agendaSection(1,'Good News','5 min',renderSegue())}
          ${agendaSection(2,'Numbers Review','5 min',renderNumbersView())}
          ${agendaSection(3,'Priorities Review','5 min',renderPrioritiesView())}
          ${agendaSection(4,'Customer &amp; Team Highlights','5 min',renderHeadlines())}
          ${agendaSection(5,'To-Do List','5 min',renderTodos())}
          ${agendaSection(6,'Issues &#x2014; Discuss &amp; Resolve','60 min',renderIssuesView())}
          ${agendaSection(7,'Conclude','5 min',renderConclude())}
        </div>
      </div>
    `;
    c.querySelector('#meeting-status').addEventListener('change',async e=>{
      const status = e.target.value;
      const { error } = await supabase.from('meetings').update({ status }).eq('id', m.id);
      if (error) { console.warn('Update meeting status failed:', error.message); showToast('Update failed','error'); return; }
      _currentMeeting.status = status;
      // v0.5.207 — keep floating pill in sync with status
      if (window.activeMeeting) {
        if (status === 'completed') window.activeMeeting.clear();
        else window.activeMeeting.set(m.id, fmtDate(m.meeting_date), orgId);
      }
      // v0.5.219 — hide the timer bar when status flips to completed (and stop
      // ticker). Re-show + restart if it flips back to in_progress.
      const bar = c.querySelector('#timer-bar');
      if (status === 'completed') {
        if (_timerInterval) { clearInterval(_timerInterval); _timerInterval = null; }
        if (bar) bar.style.display = 'none';
      } else if (bar && bar.style.display === 'none') {
        bar.style.display = '';
        // Simplest path back into the running state: re-render.
        renderDetail();
        return;
      }
      showToast('Status updated','success');
    });
    // v0.5.219 — Timer button is now Pause/Resume only. It toggles the visible
    // ticker without changing the meeting's status. To complete the meeting,
    // the user uses the status dropdown above → "Completed" (which clears the
    // floating pill via the existing handler). When the meeting is already
    // completed (e.g. opened from the past-meetings list), the timer bar is
    // hidden entirely — the meeting is done, no ticker needed.
    const timerBar = c.querySelector('#timer-bar');
    const timerBtn = c.querySelector('#timer-btn');
    const timerEl  = c.querySelector('#timer-elapsed');
    let _paused = false;

    if (m.status === 'completed') {
      if (timerBar) timerBar.style.display = 'none';
    } else {
      // Anchor elapsed time on the meeting's created_at so reload / pill-return
      // shows real elapsed since the meeting was opened — not zero.
      const startMs = m.created_at ? new Date(m.created_at).getTime() : Date.now();
      timerEl.classList.remove('hidden');
      timerBtn.textContent = '⏸ Pause';
      timerBtn.classList.add('running');
      const tick = () => {
        const s = Math.floor((Date.now() - startMs) / 1000);
        const mm = Math.floor(s / 60), ss = s % 60;
        timerEl.textContent = mm + ':' + (ss < 10 ? '0' : '') + ss;
      };
      tick();
      _timerInterval = setInterval(tick, 1000);

      timerBtn.addEventListener('click', () => {
        _paused = !_paused;
        if (_paused) {
          if (_timerInterval) { clearInterval(_timerInterval); _timerInterval = null; }
          timerBtn.textContent = '▶ Resume';
          timerBtn.classList.remove('running');
        } else {
          tick();  // snap to real elapsed (since created_at) and resume ticking
          _timerInterval = setInterval(tick, 1000);
          timerBtn.textContent = '⏸ Pause';
          timerBtn.classList.add('running');
        }
      });
    }
    c.querySelectorAll('.agenda-toggle').forEach(btn=>{
      btn.addEventListener('click',()=>{
        const content=btn.nextElementSibling;
        const isOpen=content.classList.contains('open');
        btn.classList.toggle('open',!isOpen);
        content.classList.toggle('open',!isOpen);
      });
    });
    wireHeadlines(c);
    wireTodos(c);
    wireConclude(c);
  }

  function agendaSection(num,title,time,content){
    return `<div class="agenda-section"><button class="agenda-toggle"><div class="agenda-num">${num}</div><div class="agenda-title-text">${title}</div><span class="agenda-time">${time}</span><span class="agenda-arrow">&#x25BC;</span></button><div class="agenda-content">${content}</div></div>`;
  }
  function renderSegue(){
    return `<p style="font-size:.88rem;color:#666;font-family:inherit;">Share a good news item to start the meeting &#x2014; personal or professional.</p>`;
  }

  // v0.5.206 — Helper: small "Edit ›" link at the top of an agenda section's
  // content area. Used by sections 2, 3, 5, 6 which all have dedicated edit pages.
  function editRow(href, label){
    return `<div class="agenda-edit-row"><a href="${href}" class="agenda-edit-link">${escHtml(label)} &#x203A;</a></div>`;
  }

  // ── v0.5.206 — Read-only views inside agenda sections ──
  function renderNumbersView(){
    const head = editRow('scorecard.html', 'Edit Weekly Numbers');
    if (!_scMetrics.length) {
      return head + '<div class="agenda-view-empty">No weekly numbers recorded yet.</div>';
    }
    const header = `<tr><th class="sc-name">Metric</th><th class="sc-goal">Goal</th>${_scWeeks.map(w => `<th>${escHtml(fmtWeek(w))}</th>`).join('')}</tr>`;
    const body = _scMetrics.map(m => {
      const entries = _scEntries[m.id] || {};
      const goal = (m.goal === null || m.goal === undefined) ? null : Number(m.goal);
      const cells = _scWeeks.map(w => {
        const v = entries[w];
        if (v === undefined || v === null || v === '') return `<td class="empty">&mdash;</td>`;
        let cls = '';
        if (goal !== null && !isNaN(goal)) cls = Number(v) >= goal ? ' hit' : ' miss';
        return `<td class="${cls.trim()}">${escHtml(fmtVal(v, m.measurement_type))}</td>`;
      }).join('');
      const owner = (m.owner || '').trim();
      return `<tr><td class="sc-name">${escHtml(m.name || '')}${owner ? ` <span style="font-size:.65rem;color:var(--accent);font-weight:700;display:block;margin-top:1px;">${escHtml(owner)}</span>` : ''}</td><td class="sc-goal">${goal !== null && !isNaN(goal) ? escHtml(fmtVal(goal, m.measurement_type)) : '—'}</td>${cells}</tr>`;
    }).join('');
    return head + `<div class="agenda-sc-wrap"><table class="agenda-sc-table"><thead>${header}</thead><tbody>${body}</tbody></table></div>`;
  }

  function renderPrioritiesView(){
    const head = editRow('goals.html', 'Edit Quarterly Goals');
    if (!_rocks.length) {
      return head + '<div class="agenda-view-empty">No quarterly goals recorded yet.</div>';
    }
    const STATUS_LABEL = { on_track:'On Track', at_risk:'At Risk', off_track:'Off Track', done:'Done', not_started:'Not Started' };
    const STATUS_PILL  = { on_track:'pill-green', at_risk:'pill-amber', off_track:'pill-red', done:'pill-green', not_started:'pill-grey' };
    const rows = _rocks.map(r => {
      const owner = (r.owner || '').trim();
      const meta = owner ? `<div class="meta"><span class="owner">${escHtml(owner)}</span></div>` : '';
      return `<li class="agenda-view-row"><div class="body"><div class="desc">${escHtml(r.description || '—')}</div>${meta}</div><span class="agenda-pill ${STATUS_PILL[r.status] || 'pill-grey'}">${escHtml(STATUS_LABEL[r.status] || (r.status || '—'))}</span></li>`;
    }).join('');
    return head + `<ul class="agenda-view-list">${rows}</ul>`;
  }

  function renderIssuesView(){
    const head = editRow('issues.html?category=current', 'Edit Issues List');
    if (!_issues.length) {
      return head + '<div class="agenda-view-empty">No open issues. Nice work.</div>';
    }
    const rows = _issues.map((iss, i) => {
      const owner = (iss.owner || '').trim();
      const meta = owner ? `<div class="meta"><span class="owner">${escHtml(owner)}</span></div>` : '';
      return `<li class="agenda-view-row"><span class="marker">${i + 1}.</span><div class="body"><div class="desc">${escHtml(iss.description || '—')}</div>${meta}</div></li>`;
    }).join('');
    return head + `<ul class="agenda-view-list">${rows}</ul>`;
  }
  function renderHeadlines(){
    const items=_headlines;
    return `<ul class="item-list" id="headlines-list">${items.length?items.map(h=>`<li><span class="item-text">${escHtml(h.description)}</span><span class="item-meta">${h.type==='good_news'?'&#x1F4A1;':'&#x26A0;'}</span><button class="item-del-btn" data-hid="${h.id}">&times;</button></li>`).join(''):'<li style="color:#aaa;font-style:italic;">No headlines yet.</li>'}</ul><div class="item-add-row"><select class="field-select" id="headline-type" style="flex-shrink:0;padding:7px 10px;"><option value="good_news">&#x1F4A1; Good News</option><option value="headline">&#x26A0; Headline</option></select><input type="text" class="item-add-input" id="headline-input" placeholder="Add a headline..."/><button class="ws-btn" id="add-headline-btn" style="padding:8px 14px;">Add</button></div>`;
  }
  function renderTodos(){
    // v0.5.207 — same view + Edit pattern as sections 2/3/6. Items shown as a
    // clean checklist (checkboxes still tap-able to mark done during the
    // meeting — common action). The "Edit Full List ›" link goes to the new
    // dedicated todos.html page where users add / delete / edit due-dates.
    const head = editRow('todos.html', 'Edit Full List');
    const items = _todos;
    if (!items.length) {
      return head + '<div class="agenda-view-empty">No to-dos yet. Tap Edit Full List to add one.</div>';
    }
    const rows = items.map(t => {
      const owner = (t.owner || '').trim();
      const meta = owner ? `<div class="meta"><span class="owner">${escHtml(owner)}</span></div>` : '';
      return `<li class="agenda-view-row"><input type="checkbox" ${t.done ? 'checked' : ''} data-tid="${escHtml(t.id)}" style="margin-top:3px;flex-shrink:0;width:18px;height:18px;cursor:pointer;"/><div class="body"><div class="desc" style="${t.done ? 'text-decoration:line-through;color:#aaa;font-weight:500;' : ''}">${escHtml(t.description)}</div>${meta}</div></li>`;
    }).join('');
    return head + `<ul class="agenda-view-list" id="todos-list">${rows}</ul>`;
  }
  function renderConclude(){
    // v0.5.207 — rating buttons removed. Section is just "Conclude" now —
    // a notes box for cascading messages + a Save button. Rating column
    // stays in the DB (historical data preserved), just isn't editable.
    const m = _currentMeeting;
    return `<div><span class="label-sm">Notes / Cascading Messages</span><textarea class="notes-textarea" id="meeting-notes" placeholder="Any action items or messages to cascade to the team...">${escHtml(m.notes||'')}</textarea><button class="ws-btn-secondary" id="save-notes-btn" style="margin-top:8px;">Save Notes</button></div>`;
  }

  function wireHeadlines(c){
    const addBtn = c.querySelector('#add-headline-btn');
    if (addBtn) addBtn.addEventListener('click', async () => {
      const desc=c.querySelector('#headline-input').value.trim();
      const type=c.querySelector('#headline-type').value;
      if(!desc)return;
      const { data, error } = await supabase
        .from('meeting_headlines')
        .insert({ meeting_id: _currentMeeting.id, type, description: desc })
        .select()
        .single();
      if (error || !data) { console.warn('Insert headline failed:', error && error.message); showToast('Failed','error'); return; }
      _headlines.push(data);
      showToast('Added','success');
      renderDetail();
    });
    c.querySelectorAll('.item-del-btn[data-hid]').forEach(btn=>btn.addEventListener('click', async () => {
      const hid = btn.dataset.hid;
      const { error } = await supabase.from('meeting_headlines').delete().eq('id', hid);
      if (error) { console.warn('Delete headline failed:', error.message); showToast('Failed','error'); return; }
      _headlines = _headlines.filter(h => String(h.id) !== String(hid));
      renderDetail();
    }));
  }

  function wireTodos(c){
    // v0.5.207 — Add + delete moved to todos.html (cross-meeting view). The
    // meeting view only needs checkbox tap → mark done, the key during-meeting
    // action.
    c.querySelectorAll('input[type=checkbox][data-tid]').forEach(cb=>cb.addEventListener('change', async () => {
      const tid = cb.dataset.tid;
      const todo = _todos.find(t => String(t.id) === String(tid));
      const newDone = cb.checked;
      const { error } = await supabase.from('meeting_todos').update({ done: newDone }).eq('id', tid);
      if (error) { console.warn('Update todo failed:', error.message); cb.checked = !cb.checked; showToast('Failed','error'); return; }
      if (todo) todo.done = newDone;
      // Strike-through the text without re-rendering
      const row = cb.closest('.agenda-view-row');
      const desc = row && row.querySelector('.desc');
      if (desc) desc.style.cssText = newDone ? 'text-decoration:line-through;color:#aaa;font-weight:500;' : '';
    }));
  }

  function wireConclude(c){
    // v0.5.207 — rating button wiring removed; only notes save remains.
    const notesBtn=c.querySelector('#save-notes-btn');
    if (notesBtn) notesBtn.addEventListener('click', async () => {
      const notes=c.querySelector('#meeting-notes').value;
      const { error } = await supabase.from('meetings').update({ notes }).eq('id', _currentMeeting.id);
      if (error) { console.warn('Update notes failed:', error.message); showToast('Failed','error'); return; }
      _currentMeeting.notes = notes;
      showToast('Notes saved','success');
    });
  }

  (async()=>{
    const{data:{user}, error: authError}=await supabase.auth.getUser();
    if(!user||authError){window.location.href='login.html';return}
    const { data: profile } = await supabase
      .from('users').select('membership_status').eq('id', user.id).single();
    if (!profile || profile.membership_status !== 'active') {
      window.location.href = 'inactive.html'; return;
    }
    orgId = window.activeOrg && window.activeOrg.get();
    if (!orgId) { window.location.href = 'index.html'; return; }

    // Fetch cadence to determine fiscal year start for rocks query
    try {
      const { data: cad } = await supabase
        .from('business_cadence')
        .select('last_annual_planning_date, annual_planning_date')
        .eq('organisation_id', orgId)
        .maybeSingle();
      const cadDateStr = cad && (cad.last_annual_planning_date || cad.annual_planning_date);
      if (cadDateStr) _meetingFiscalStart = new Date(cadDateStr + 'T00:00:00').getMonth();
    } catch (e) { /* default to calendar quarters */ }

    meetingId = getMeetingId();
    if (!meetingId) {
      // No meeting id in URL → redirect to the meeting list per spec.
      window.location.href = 'meeting.html';
      return;
    }

    document.getElementById('signOutBtn').addEventListener('click',async()=>{
      await supabase.auth.signOut(); window.location.href='login.html';
    });

    await loadOwnerOptions();
    try { await loadDetail(meetingId); }
    catch(e){ console.warn('Load error:', e); document.getElementById('meeting-empty').classList.remove('hidden'); }
    document.body.style.opacity='1';
  })();

  // Owner <select> populated from team_members (canonical names → per-user reports).
  // Used in the todo-add row inside renderTodos().
  let OWNER_NAMES = [];
  async function loadOwnerOptions(){
    if (!orgId) return;
    const { data, error } = await supabase
      .from('team_members')
      .select('display_name, invited_email, status')
      .eq('organisation_id', orgId)
      .neq('status', 'removed');
    if (error) { console.warn('loadOwnerOptions:', error.message); return; }
    const names = (data || [])
      .map(m => (m.display_name && m.display_name.trim()) || (m.invited_email && m.invited_email.trim()) || '')
      .filter(Boolean);
    OWNER_NAMES = [...new Set(names)].sort((a,b)=>a.localeCompare(b));
  }
  function ownerSelectHtml(id, currentValue, opts){
    opts = opts || {};
    const style = opts.maxWidth ? `style="max-width:${opts.maxWidth};"` : '';
    let html = `<select class="item-add-input" id="${id}" ${style}>`;
    html += '<option value="">— Owner —</option>';
    OWNER_NAMES.forEach(n => {
      const sel = (n === currentValue) ? ' selected' : '';
      html += `<option value="${escHtml(n)}"${sel}>${escHtml(n)}</option>`;
    });
    if (currentValue && !OWNER_NAMES.includes(currentValue)) {
      html += `<option value="${escHtml(currentValue)}" selected>${escHtml(currentValue)} (not on team)</option>`;
    }
    html += '</select>';
    return html;
  }
  </script>
</body>
